plugins {
    id 'java'
    id 'application'
    id 'maven-publish'
    id 'eclipse'
    id 'org.graalvm.buildtools.native' version '0.10.6'
    id 'com.gradleup.shadow' version '8.3.5'
    // NOTE: the 'org.graalvm.python' plugin is deliberately NOT applied — it is only
    // needed to vendor pip packages into the jar and it forces a Java 17+ Gradle
    // daemon; the GraalPy runtime + stdlib come from the org.graalvm.python:python
    // dependency below
}

// Adjust these versions to the latest available
def polyglotVersion = '24.2.0' // or newer

// JPMS openings required by GraalPy embedding (mirrors the 'run' task and the
// shadow jar's Add-Opens manifest attribute)
def graalpyAddOpens = [
        '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
        '--add-opens=java.base/java.io=ALL-UNNAMED',
        '--add-opens=java.base/java.util=ALL-UNNAMED',
        '--add-opens=java.base/java.nio=ALL-UNNAMED',
        '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED'
]

configurations.all {
    resolutionStrategy {
        force "org.graalvm.polyglot:polyglot:${polyglotVersion}"
        force "org.graalvm.polyglot:python:${polyglotVersion}"
    }
}

// Native Image build (experimental; see POLYGLOT_INTEGRATION.md §goal-3): the
// default 'python'/'js' artifacts are the Oracle GraalVM flavours whose bundled
// native-image config force-enables the (absent-on-CE) Truffle enterprise
// feature. Building a native image on GraalVM CE needs the '-community'
// variants, swapped in only for such builds so the shipped jar is unchanged.
//   ./gradlew -PnativeImage :nodel-jyhost:nativeCompile   (GRAALVM_HOME = GraalVM CE for JDK 24)
if (project.hasProperty('nativeImage')) {
    configurations.all {
        resolutionStrategy.dependencySubstitution {
            substitute module('org.graalvm.python:python') using module("org.graalvm.python:python-community:${polyglotVersion}")
            substitute module('org.graalvm.js:js') using module("org.graalvm.js:js-community:${polyglotVersion}")
        }
    }
}

repositories {
    mavenCentral()
}

description = 'Nodel JyHost'

// ------------------------------------------------------------------
// Dependencies
// ------------------------------------------------------------------
configurations {
    // carries LocalAutoDNS (nodel-framework's test fixtures) so startNodelhost can put it
    // on the launched host's classpath without it shipping in any production jar
    discoveryFixture
}

dependencies {
    implementation project(':nodel-webui-js')
    implementation project(':nodel-framework')
    discoveryFixture testFixtures(project(':nodel-framework'))
    implementation 'commons-daemon:commons-daemon:1.6.0'
    implementation 'org.slf4j:slf4j-api:1.7.10'

    // for the Nodel HTTP client:
    implementation group: 'org.apache.httpcomponents', name: 'httpclient', version: '4.5.14'

    // convenience dependency: required *only* for 'recipe sync' node
    implementation("org.eclipse.jgit:org.eclipse.jgit:6.10.0.202406032230-r")

    // convenience dependency: required for new SNMP-based nodes
    implementation('org.snmp4j:snmp4j:2.5.8') {
        exclude group:'log4j', module:'log4j' // (brings one extra dependency: log4j; can explicity exclude it because it's optional at runtime)
    }

    // convenience dependency: JWTs (JSON Web Tokens), see https://github.com/museumsvictoria/nodel/discussions/297
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-orgjson:0.12.6'

    // Add joda-time dependency
    implementation 'joda-time:joda-time:2.14.0'

    // ------------------------------------------------------------------
    // GraalVM for JDK 21 dependencies for embedding polyglot Python
    // ------------------------------------------------------------------

    implementation "org.graalvm.python:python:${polyglotVersion}"
    implementation "org.graalvm.polyglot:polyglot:${polyglotVersion}"

    // GraalJS — enables 'script.js' nodes alongside 'script.py' (community artifacts)
    implementation "org.graalvm.js:js:${polyglotVersion}"

    // Playwright e2e testing
    testImplementation 'com.microsoft.playwright:playwright:1.52.0'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.12.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.12.2'
    // JUnit 5.11+ requires an aligned platform-launcher; this module wires JUnit manually
    // (no JVM Test Suite plugin) so declare it explicitly to avoid Gradle's older bundled launcher.
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

// ------------------------------------------------------------------
// Application plugin
// ------------------------------------------------------------------
application {
    mainClass = 'org.nodel.jyhost.Launch'
}

// ------------------------------------------------------------------
// Jar / FatJar tasks
// ------------------------------------------------------------------
jar {
    from "$buildDir/output"
    archiveBaseName = 'nodel-jyhost'
    manifest {
        attributes(
                'Implementation-Title': 'Nodel JyHost',
                'Implementation-Version': archiveVersion
        )
    }
}


shadowJar {
    archiveBaseName = 'nodelhost'
    archiveAppendix = rootProject.ext.branch
    archiveClassifier = 'rev' + rootProject.ext.rev
    destinationDirectory = new File(buildDir, 'distributions/standalone')

    manifest {
        attributes(
                'Implementation-Title': 'Nodel JyHost',
                'Implementation-Version': archiveVersion,
                'Main-Class': application.mainClass,
                // lets 'java -jar nodelhost.jar' run without explicit --add-opens flags
                'Add-Opens': graalpyAddOpens.collect { it.replace('--add-opens=', '').replace('=ALL-UNNAMED', '') }.join(' ')
        )
    }

    mergeServiceFiles()
    mergeServiceFiles('META-INF/graalpython')
    mergeServiceFiles('META-INF/native')

    mergeServiceFiles('META-INF/services/*')
    mergeServiceFiles('META-INF/truffle/*')
    mergeServiceFiles('META-INF/native-image/*')

    // Merge Truffle files using the service file transformer
    mergeServiceFiles('META-INF/truffle/language')
    mergeServiceFiles('META-INF/truffle/instrument')

    mergeServiceFiles('META-INF/services/org.graalvm.polyglot.*')

    // Your existing excludes for signing files
    exclude 'META-INF/*.RSA', 'META-INF/*.SF','META-INF/*.DSA'
}

// Configure JVM arguments for the run task to handle JPMS restrictions
run {
    standardInput = System.in

    jvmArgs = graalpyAddOpens + ['--enable-native-access=ALL-UNNAMED']
}

tasks.build.dependsOn tasks.shadowJar

tasks.register('unversioned', Copy) {
    dependsOn 'shadowJar'
    from(new File(buildDir, 'distributions/standalone')) {
        rename('.*($archiveVersion)*', 'nodelhost.jar')
    }
    into new File(buildDir, 'distributions/standalone')
}

// ------------------------------------------------------------------
// Self-contained app-image (jpackage; bundles the toolchain's Java runtime)
// Additive packaging for machines with no Java installed — the plain
// 'build' -> runnable-jar flow is untouched. See BUILDING.md / README.
// ------------------------------------------------------------------

// (isWindows / toolchainLauncher are shared with the test infrastructure below)
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
// the toolchain JDK Gradle provisions: jpackage lives beside its 'java', and test
// hosts must run on it too (a PATH 'java' may be older and unable to run GraalPy)
def toolchainLauncher = javaToolchains.launcherFor(java.toolchain)

def jpackageImageDir = new File(buildDir, 'jpackage/image')

tasks.register('jpackageAppImage') {
    dependsOn 'shadowJar'
    group = 'distribution'
    description = 'Builds a self-contained app-image (bundled Java runtime) via jpackage'
    inputs.file(tasks.shadowJar.archiveFile)
    outputs.dir(jpackageImageDir)

    doLast {
        def jarFile = tasks.shadowJar.archiveFile.get().asFile

        // jpackage copies EVERYTHING in --input into the image: stage the one jar alone
        def stagingDir = new File(buildDir, 'jpackage/staging')
        delete stagingDir
        stagingDir.mkdirs()
        copy { from jarFile; into stagingDir }

        delete jpackageImageDir
        jpackageImageDir.mkdirs()

        def toolchainBinDir = toolchainLauncher.get().executablePath.asFile.parentFile
        def jpackageExe = new File(toolchainBinDir, isWindows ? 'jpackage.exe' : 'jpackage')
        def args = [jpackageExe.absolutePath,
                    '--type', 'app-image',
                    '--name', 'nodelhost',
                    '--vendor', 'Nodel',
                    '--app-version', rootProject.ext.baseVersion,
                    '--input', stagingDir.absolutePath,
                    '--main-jar', jarFile.name,
                    '--dest', jpackageImageDir.absolutePath]
        // same JPMS openings the shadow jar's manifest carries (jpackage launchers
        // don't honour the Add-Opens manifest attribute) + native access for GraalPy;
        // 'nodel.consoleless' tells the host that an instant stdin EOF (double-click,
        // nohup, docker -d) is not a shutdown request — see Launch.tryReadFromConsole
        (graalpyAddOpens + ['--enable-native-access=ALL-UNNAMED', '-Dnodel.consoleless=true']).each {
            args += ['--java-options', it]
        }
        exec { commandLine args }

        logger.lifecycle("app-image: " + jpackageImageDir.listFiles().collect { it.name }.join(', '))
    }
}

// Archives the app-image preserving exec bits and symlinks (Gradle's Zip/Tar don't),
// hence the command-line tar/zip. Output: build/distributions/app-image/
tasks.register('packageAppImage') {
    dependsOn 'jpackageAppImage'
    group = 'distribution'
    description = 'Archives the jpackage app-image for distribution'
    inputs.dir(jpackageImageDir)
    outputs.dir(new File(buildDir, 'distributions/app-image'))

    doLast {
        def outDir = new File(buildDir, 'distributions/app-image')
        delete outDir
        outDir.mkdirs()

        def osName = System.getProperty('os.name').toLowerCase()
        def os = osName.contains('mac') ? 'macos' : (osName.contains('windows') ? 'windows' : 'linux')
        def archProp = System.getProperty('os.arch')
        def arch = (archProp == 'amd64' || archProp == 'x86_64') ? 'x64' : archProp

        // same naming scheme as the shadow jar, plus platform
        def base = tasks.shadowJar.archiveFileName.get() - '.jar' + "-${os}-${arch}"
        def topDir = os == 'macos' ? 'nodelhost.app' : 'nodelhost'
        def archive = new File(outDir, base + (os == 'linux' ? '.tar.gz' : '.zip'))

        def archiveCmd = os == 'linux' ? ['tar', 'czf', archive.absolutePath, topDir]
                : os == 'macos' ? ['zip', '-qry', archive.absolutePath, topDir]
                : ['powershell', '-Command', "Compress-Archive -Path ${topDir} -DestinationPath '${archive.absolutePath}'"]
        exec { workingDir jpackageImageDir; commandLine archiveCmd }

        logger.lifecycle("distributable: " + outDir.listFiles().collect { it.name }.join(', '))
    }
}

// ------------------------------------------------------------------
// GraalVM Native Image Configuration
// (Requires GraalVM for JDK 21 or later when building native images.)
// ------------------------------------------------------------------
graalvmNative {

    agent {
        defaultMode = 'conditional'
    }
    binaries {
        main {
            resources.autodetect()
            imageName = 'nodelhost'
            buildArgs.addAll([
                    // If certain classes should init at build-time or run-time:

                    // NOTE: no '--initialize-at-build-time=org.slf4j' — Nodel's slf4j binding
                    // (SimpleLoggerFactory -> Level -> timers/threads) would be captured in the
                    // image heap and native-image rejects run-time state there
                    '-H:+ReportExceptionStackTraces'
            ])
            // (memory-constrained builders can cap the image builder heap via the
            // NATIVE_IMAGE_OPTIONS env var, e.g. '-J-Xmx13g' — see native-image.yml)
        }
    }
}

// Avoid duplicates in distribution tasks
tasks.named('distTar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('distZip') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// ------------------------------------------------------------------
// Test infrastructure (integration & e2e) — see BUILDING.md "TESTING"
// ------------------------------------------------------------------
// (isWindows / toolchainLauncher are defined in the packaging section above)
def nodelProcess = null
def discoveryEnv = System.getenv('NODEL_TEST_DISCOVERY')
def useLocalDiscovery = (discoveryEnv == null || discoveryEnv.trim().isEmpty()
        || discoveryEnv.trim().equalsIgnoreCase('false') || discoveryEnv.trim().equals('0'))

tasks.register('cleanNodelhostTemp', Delete) {
    delete layout.projectDirectory.dir('nodelhost-temp')
}

tasks.register('startNodelhost') {
    dependsOn 'cleanNodelhostTemp', 'classes', configurations.discoveryFixture
    doLast {
        def javaExe = toolchainLauncher.get().executablePath.asFile.absolutePath
        def hostClasspath = files(sourceSets.main.runtimeClasspath, configurations.discoveryFixture).asPath
        // Kill any existing process on the test port before starting
        if (isWindows) {
            ['powershell', '-Command',
             'Get-NetTCPConnection -LocalPort 18085 -ErrorAction SilentlyContinue | ForEach-Object { Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue }'
            ].execute().waitFor()
        } else {
            ['bash', '-c', 'lsof -ti :18085 | xargs kill -9 2>/dev/null || true'].execute().waitFor()
        }
        // Brief pause to ensure port is released
        Thread.sleep(1000)

        def tempDir = layout.projectDirectory.dir('nodelhost-temp').asFile
        tempDir.mkdirs()

        if (useLocalDiscovery) {
            logger.lifecycle("Using LocalAutoDNS for tests (set NODEL_TEST_DISCOVERY=1 for multicast discovery)")
        } else {
            logger.lifecycle("Using multicast AutoDNS for tests (NODEL_TEST_DISCOVERY enabled)")
        }

        def args = [javaExe, '-cp', hostClasspath, '-ea']
        args.addAll(graalpyAddOpens)
        if (useLocalDiscovery) {
            args.add('-Dorg.nodel.discovery.impl=org.nodel.discovery.LocalAutoDNS;instance')
        }
        args.addAll(['org.nodel.jyhost.Launch', '-p', '18085'])
        def pb = new ProcessBuilder(args)
        pb.redirectInput(ProcessBuilder.Redirect.PIPE)
        pb.directory(tempDir)
        pb.redirectOutput(new File(tempDir, 'output.log'))
        pb.redirectError(new File(tempDir, 'error.log'))
        nodelProcess = pb.start()

        // Wait for server to be ready by checking if HTTP responds
        def maxAttempts = 60
        def attempt = 0
        while (attempt < maxAttempts) {
            Thread.sleep(1000)
            try {
                def url = new URL('http://127.0.0.1:18085/')
                def conn = url.openConnection()
                conn.setConnectTimeout(2000)
                conn.setReadTimeout(2000)
                conn.connect()
                def responseCode = conn.responseCode
                conn.disconnect()
                if (responseCode == 200) {
                    logger.lifecycle("Nodel host is ready on port 18085 (HTTP 200)")
                    break
                }
            } catch (Exception e) {
                // Server not ready yet, continue waiting
            }
            attempt++
            if (attempt >= maxAttempts) {
                throw new GradleException("Nodel host failed to start within ${maxAttempts} seconds; check nodel-jyhost/nodelhost-temp/output.log and error.log")
            }
        }
    }
}

tasks.register('stopNodelhost') {
    doLast {
        if (nodelProcess?.isAlive()) {
            try {
                nodelProcess.outputStream.close()
            } catch (Exception ignored) {
                // Process may have exited or closed stdin already; fall through to wait/cleanup.
            }
            if (!nodelProcess.waitFor(5, java.util.concurrent.TimeUnit.SECONDS) && nodelProcess.isAlive()) {
                nodelProcess.destroyForcibly()
                nodelProcess.waitFor(10, java.util.concurrent.TimeUnit.SECONDS)
            }
        }
        // Platform-specific orphan process cleanup
        if (isWindows) {
            // Windows: Use PowerShell to find and kill process on port 18085
            ['powershell', '-Command',
             'Get-NetTCPConnection -LocalPort 18085 -ErrorAction SilentlyContinue | ForEach-Object { Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue }'
            ].execute().waitFor()
        } else {
            // Unix: Use lsof to find and kill process on port 18085
            ['bash', '-c', 'lsof -ti :18085 | xargs kill -9 2>/dev/null || true'].execute().waitFor()
        }
    }
}

tasks.register('playwright', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
}

// Playwright Browser Setup Tasks (used by CI for version-consistent installation)
tasks.register('playwrightInstallDeps', JavaExec) {
    description = 'Install Playwright system dependencies for Chromium'
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install-deps', 'chromium'
}

tasks.register('playwrightInstall', JavaExec) {
    description = 'Install Playwright Chromium browser'
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', 'chromium'
}

test {
    dependsOn 'startNodelhost'
    useJUnitPlatform()
    jvmArgs graalpyAddOpens
    // GraalPy contexts are memory-hungry and some tests boot host singletons;
    // isolate each test class in its own worker JVM with enough heap
    forkEvery = 1
    maxHeapSize = '2g'
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
    finalizedBy 'stopNodelhost'
}

// Integration Tests - all non-E2E-tagged tests (API, smoke and browser-assisted integration tests)
task integrationTest(type: Test) {
    dependsOn 'startNodelhost'
    useJUnitPlatform {
        excludeTags 'e2e'
    }
    jvmArgs graalpyAddOpens
    forkEvery = 1
    maxHeapSize = '2g'
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
    finalizedBy 'stopNodelhost'
}

// E2E Tests - Real user interaction tests (click, type, navigate)
task e2eTest(type: Test) {
    dependsOn 'startNodelhost'
    useJUnitPlatform {
        includeTags 'e2e'
    }
    jvmArgs graalpyAddOpens
    forkEvery = 1
    maxHeapSize = '2g'
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
    finalizedBy 'stopNodelhost'
}
