plugins {
    id 'java'
    id 'application'
    id 'maven-publish'
    id 'eclipse'
    id 'org.graalvm.buildtools.native' version '0.10.6'
    id 'com.gradleup.shadow' version '8.3.5'
    id 'org.graalvm.python' version '24.2.0' // Match your polyglotVersion
}

// Adjust these versions to the latest available
def polyglotVersion = '24.2.0' // or newer

configurations.all {
    resolutionStrategy {
        force "org.graalvm.polyglot:polyglot:${polyglotVersion}"
        force "org.graalvm.polyglot:python:${polyglotVersion}"
    }
}

repositories {
    mavenCentral()
}

group = 'org.example'
version = '1.0-SNAPSHOT'
description = 'Nodel JyHost'

// ------------------------------------------------------------------
// Dependencies
// ------------------------------------------------------------------
dependencies {
    implementation project(':nodel-webui-js')
    implementation project(':nodel-framework')
    implementation 'commons-daemon:commons-daemon:1.0.15'
    implementation 'org.slf4j:slf4j-api:1.7.10'
    implementation 'org.python:jython-standalone:2.5.4-rc1'

    // for the Nodel HTTP client:
    implementation group: 'org.apache.httpcomponents', name: 'httpclient', version: '4.5.5'

    // convenience dependency: required *only* for 'recipe sync' node
    implementation 'org.eclipse.jgit:org.eclipse.jgit:3.7.1.+'

    // convenience dependency: required for new SNMP-based nodes
    implementation('org.snmp4j:snmp4j:2.5.8') {
        exclude group:'log4j', module:'log4j' // (brings one extra dependency: log4j; can explicity exclude it because it's optional at runtime)
    }

    // convenience dependency: JWTs (JSON Web Tokens), see https://github.com/museumsvictoria/nodel/discussions/297
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-orgjson:0.11.5'

    // Add joda-time dependency
    implementation 'joda-time:joda-time:2.10.14'

    // ------------------------------------------------------------------
    // New GraalVM for JDK 21 dependencies for embedding polyglot Python
    // ------------------------------------------------------------------

    implementation "org.graalvm.python:python:${polyglotVersion}"
    implementation "org.graalvm.polyglot:polyglot:${polyglotVersion}"
}

// ------------------------------------------------------------------
// Application plugin
// ------------------------------------------------------------------
application {
    mainClass = 'org.nodel.jyhost.Launch'

    // If you want to supply extra JVM args at runtime:
    // applicationDefaultJvmArgs = [...]
}

// ------------------------------------------------------------------
// Jar / FatJar tasks
// ------------------------------------------------------------------
jar {
    from "$buildDir/output"
    archiveBaseName = 'nodel-jyhost'
    manifest {
        attributes(
                'Implementation-Title': 'Nodel JyHost',
                'Implementation-Version': archiveVersion
        )
    }
}


shadowJar {
    archiveBaseName = 'nodelhost'
    archiveClassifier = 'rev' + rootProject.ext.rev
    destinationDirectory = new File(buildDir, 'distributions/standalone')

    manifest {
        attributes(
                'Implementation-Title': 'Nodel JyHost',
                'Implementation-Version': archiveVersion,
                'Main-Class': application.mainClass
        )
    }

    mergeServiceFiles()
    mergeServiceFiles('META-INF/graalpython')
    mergeServiceFiles('META-INF/native')

    mergeServiceFiles('META-INF/services/*')
    mergeServiceFiles('META-INF/truffle/*')
    mergeServiceFiles('META-INF/native-image/*')

    // Merge Truffle files using the service file transformer
    mergeServiceFiles('META-INF/truffle/language')
    mergeServiceFiles('META-INF/truffle/instrument')

    mergeServiceFiles('META-INF/services/org.graalvm.polyglot.*')
    mergeServiceFiles('META-INF/truffle/language')
    mergeServiceFiles('META-INF/truffle/instrument')

    dependencies {
    }

    // Your existing excludes for signing files
    exclude 'META-INF/*.RSA', 'META-INF/*.SF','META-INF/*.DSA'
}

// Configure JVM arguments for the run task to handle JPMS restrictions
run {
    standardInput = System.in

    jvmArgs = [
            '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
            '--add-opens=java.base/java.io=ALL-UNNAMED',
            '--add-opens=java.base/java.util=ALL-UNNAMED',
            '--add-opens=java.base/java.nio=ALL-UNNAMED',
            '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
            '--enable-native-access=ALL-UNNAMED'
    ]
}

tasks.build.dependsOn tasks.shadowJar

tasks.register('unversioned', Copy) {
    dependsOn 'shadowJar'
    from(new File(buildDir, 'distributions/standalone')) {
        rename('.*($archiveVersion)*', 'nodelhost.jar')
    }
    into new File(buildDir, 'distributions/standalone')
}

// ------------------------------------------------------------------
// GraalVM Native Image Configuration
// (Requires GraalVM for JDK 21 or later when building native images.)
// ------------------------------------------------------------------
graalvmNative {

    agent {
        defaultMode = 'conditional'
    }
    binaries {
        main {
            resources.autodetect()
            imageName = 'nodelhost'
            buildArgs.addAll([
                    // If certain classes should init at build-time or run-time:

                    '--initialize-at-build-time=org.slf4j',
                    '-H:+ReportExceptionStackTraces'
            ])
        }
    }
}

// Avoid duplicates in distribution tasks
tasks.named('distTar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('distZip') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}