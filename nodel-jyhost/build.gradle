plugins {
    id 'java'
    id 'application'
    id 'maven-publish'
    id 'eclipse'
    id 'org.graalvm.buildtools.native' version '0.9.28'
    id 'com.gradleup.shadow' version '8.3.5'
}

// Adjust these versions to the latest available
def polyglotVersion = '24.1.2' // or newer

configurations.all {
    resolutionStrategy {
        force "org.graalvm.polyglot:polyglot:${polyglotVersion}"
        force "org.graalvm.polyglot:python:${polyglotVersion}"
    }
}

repositories {
    mavenCentral()
}

group = 'org.example'
version = '1.0-SNAPSHOT'
description = 'Nodel JyHost'

// ------------------------------------------------------------------
// Dependencies
// ------------------------------------------------------------------
dependencies {
    // Your existing project dependencies:
    implementation project(':nodel-webui-js')
    implementation project(':nodel-framework')

    implementation 'commons-daemon:commons-daemon:1.0.15'
    implementation 'org.slf4j:slf4j-api:1.7.10'
    implementation 'org.apache.httpcomponents:httpclient:4.5.5'
    implementation('org.eclipse.jgit:org.eclipse.jgit:3.7.1.+')
    implementation('org.snmp4j:snmp4j:2.5.8') {
        exclude group: 'log4j', module: 'log4j'
    }
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-orgjson:0.11.5'
    implementation 'joda-time:joda-time:2.10.14'

    // ------------------------------------------------------------------
    // New GraalVM for JDK 21 dependencies for embedding polyglot Python
    // ------------------------------------------------------------------
    // "polyglot" is the core Truffle & Polyglot APIs:
    implementation "org.graalvm.polyglot:polyglot:${polyglotVersion}"

    // "python" pulls in the GraalPy runtime so you can embed Python:
    // (If you prefer an open-source only version, use "python-community")
    implementation "org.graalvm.polyglot:python:${polyglotVersion}"

    // If you are using the newer approach, you generally do NOT need
    // 'org.graalvm.sdk:graal-sdk' or 'org.graalvm.truffle:truffle-api'
    // directly anymore, as they are included transitively in 'polyglot'.
}

// ------------------------------------------------------------------
// Application plugin
// ------------------------------------------------------------------
application {
    mainClass = 'org.nodel.jyhost.Launch'

    // If you want to supply extra JVM args at runtime:
    // applicationDefaultJvmArgs = [...]
}

// ------------------------------------------------------------------
// Jar / FatJar tasks
// ------------------------------------------------------------------
jar {
    from "$buildDir/output"
    archiveBaseName = 'nodel-jyhost'
    manifest {
        attributes(
                'Implementation-Title': 'Nodel JyHost',
                'Implementation-Version': archiveVersion
        )
    }
}


shadowJar {
    archiveBaseName = 'nodelhost'
    archiveClassifier = 'rev' + rootProject.ext.rev
    destinationDirectory = new File(buildDir, 'distributions/standalone')

    manifest {
        attributes(
                'Implementation-Title': 'Nodel JyHost',
                'Implementation-Version': archiveVersion,
                'Main-Class': application.mainClass
        )
    }

    with jar

    mergeServiceFiles()
    mergeServiceFiles('META-INF/graalpython')
    mergeServiceFiles('META-INF/native')

    // Critical for GraalVM polyglot
    append 'META-INF/truffle/language'
    append 'META-INF/truffle/instrument'

    // Your existing excludes
    exclude 'META-INF/*.RSA', 'META-INF/*.SF','META-INF/*.DSA'

    // Optimize the jar size
    minimize {
        exclude(dependency('org.graalvm.polyglot:.*:.*'))
        exclude(dependency('org.graalvm.polyglot:python:.*'))
    }
}

tasks.build.dependsOn tasks.shadowJar

tasks.register('unversioned', Copy) {
    dependsOn 'shadowJar'
    from(new File(buildDir, 'distributions/standalone')) {
        rename('.*($archiveVersion)*', 'nodelhost.jar')
    }
    into new File(buildDir, 'distributions/standalone')
}

// ------------------------------------------------------------------
// GraalVM Native Image Configuration
// (Requires GraalVM for JDK 21 or later when building native images.)
// ------------------------------------------------------------------
graalvmNative {
    binaries {
        main {
            imageName = 'nodelhost'
            buildArgs.addAll([
                    // If certain classes should init at build-time or run-time:
                    '--initialize-at-run-time=org.python',
                    '--initialize-at-build-time=org.slf4j',
                    '-H:+ReportExceptionStackTraces'
            ])
        }
    }
}

// Avoid duplicates in distribution tasks
tasks.named('distTar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('distZip') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
