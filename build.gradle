import org.joda.time.DateTime

def commandOutput = { List<String> command ->
    providers.exec {
        commandLine command
    }.standardOutput.asText.get().trim()
}

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'joda-time:joda-time:2.14.0'
    }
}

ext {
    getGitInfo = {
        def branch = ""
        def id = ""
        def rev = ""
        def origin = ""

        try {
            branch = commandOutput(['git', 'rev-parse', '--abbrev-ref', 'HEAD'])
            id = commandOutput(['git', 'rev-parse', 'HEAD'])
            rev = commandOutput(['git', 'rev-list', '--count', 'HEAD'])
            origin = commandOutput(['git', 'config', '--get', 'remote.origin.url'])
        } catch (Exception e) {
            logger.warn("Error executing git command: ${e.message}")
        }

        return [
                branch : branch,
                id     : id,
                rev    : rev,
                origin : origin
        ]
    }

    gitInfo = getGitInfo()
    buildSummary = gitInfo.id
    hostname = InetAddress.getLocalHost().getHostName().toUpperCase()
    now = DateTime.now().toString()
    rev = gitInfo.rev.replaceAll(/[^a-zA-Z0-9]/, '')

    branch = gitInfo.branch
    if (branch == 'master') {
        branch = 'release'
    } else if (branch.contains('/')) {
        branch = branch.substring(branch.indexOf('/') + 1)
    }

    baseVersion = '3.0.0'
    versionIdentifier = "${baseVersion}-${branch}_r${rev}"
    println "versionIdentifier: ${versionIdentifier}"
}

subprojects {
    apply plugin: 'java'
    group = 'org.nodel'
    version = rootProject.ext.baseVersion

    // GraalPy 25.2 is supported on the matching GraalVM 25 toolchain. The
    // foojay resolver auto-provisions it when it is not installed locally.
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
            vendor = JvmVendorSpec.GRAAL_VM
        }
    }

    repositories {
        mavenCentral()
    }
}
