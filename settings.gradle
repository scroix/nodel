pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral() // Explicitly add mavenCentral
    }
}

plugins {
    // auto-provisions the JDK required by the java toolchain (see build.gradle)
    // when no matching local installation exists
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

include 'nodel-framework', 
        'nodel-webui-js', 
        'nodel-jyhost'
